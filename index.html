<style>
  /* ---------- Charte OM : bleu ciel, blanc, marine, étoile dorée ---------- */
  :root { --ciel: #2FAEE0; --ciel-d: #1591C9; --ciel-l: #BFE8F8; --marine: #081A33; --marine-2: #0F2C52; --or: #E9C46A;
    --rouge: #E63946; --vert: #2ECC71; --papier: #F7FBFE; --txt: #0A1F3C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: 'Montserrat', system-ui, sans-serif; color: #fff;
    background: radial-gradient(ellipse at 50% -10%, #1d5a92 0%, var(--marine-2) 42%, var(--marine) 100%) fixed var(--marine); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  #app { min-height: 100vh; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px; padding: 12px; }

  /* Boutons : gros, lisibles, faciles à toucher */
  .btn { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 56px; padding: 10px 20px;
    border-radius: 16px; font-size: 18px; font-weight: 800; color: #fff; background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.35); transition: transform .12s, filter .12s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active:not(:disabled) { transform: translateY(2px) scale(.98); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: linear-gradient(180deg, #52c6f1, var(--ciel-d)); border-color: transparent; box-shadow: 0 5px 0 #0b6e9c, 0 10px 24px rgba(47,174,224,.35); }
  .btn.white { background: #fff; color: var(--marine); border-color: transparent; box-shadow: 0 5px 0 #a9cde3; }
  .btn.ghost { border-color: transparent; background: transparent; opacity: .85; }
  .btn.danger { background: transparent; border-color: rgba(230,57,70,.7); color: #ff9aa2; }
  .btn.on { background: var(--ciel); border-color: #fff; }
  .btn.sm { min-height: 40px; font-size: 14px; padding: 6px 12px; border-radius: 12px; width: auto; }
  .row { display: flex; gap: 8px; width: 100%; } .row > .btn { flex: 1; }
  .ico { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); font-size: 18px; flex-shrink: 0; }

  /* ---------- Accueil ---------- */
  .home { width: 100%; min-height: calc(100vh - 24px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px 0; }
  .crest { display: flex; flex-direction: column; align-items: center; }
  .crest .star { color: var(--or); font-size: clamp(26px, 7vw, 40px); line-height: 1; margin-bottom: 4px; text-shadow: 0 0 18px rgba(233,196,106,.6); }
  .crest svg { width: min(48vw, 210px); filter: drop-shadow(0 14px 40px rgba(47,174,224,.55)); animation: float 4s ease-in-out infinite; }
  .crest.sm svg { width: min(28vw, 110px); }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .home h1 { margin: 6px 0 0; font-size: clamp(36px, 10vw, 64px); font-weight: 900; letter-spacing: .04em; line-height: 1; }
  .home h1 span, .home h2 span { color: var(--ciel); }
  .home h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .home .tag { opacity: .75; margin: 0 0 12px; font-weight: 600; }
  .menu { width: min(92vw, 380px); display: flex; flex-direction: column; gap: 14px; }
  .menu .btn { min-height: 64px; font-size: 20px; }
  .lbl { font-weight: 700; opacity: .8; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: -6px; }
  .seg { display: flex; gap: 10px; } .seg .btn { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .inp { width: 100%; min-height: 56px; border-radius: 16px; border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08);
    color: #fff; font: inherit; font-size: 18px; font-weight: 700; padding: 0 16px; text-align: center; }
  .field input:focus, .inp:focus { outline: none; border-color: var(--ciel); }
  .inp::placeholder, .field input::placeholder { color: rgba(255,255,255,.5); }

  /* ---------- Plateau ---------- */
  #board { container-type: inline-size; display: grid; grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr; grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr;
    width: min(96vw, calc(100vh - 24px), 880px); aspect-ratio: 1; gap: 2px; background: var(--marine); border: 3px solid var(--ciel);
    border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 6px rgba(47,174,224,.15); }
  .cell { background: var(--papier); color: var(--txt); font-size: clamp(5.5px, 1.15cqi, 12px); font-weight: 700; line-height: 1.1; text-align: center;
    position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 1px; }
  .cell:hover { outline: 3px solid var(--ciel); z-index: 2; }
  .cell.corner { background: linear-gradient(135deg, #dff3fc, #fff); justify-content: center; gap: 2px; }
  .cell.here { box-shadow: inset 0 0 0 3px var(--ciel); }
  .cell.mort { background: #cfd8e2; }
  .cell.mort b::after { content: ' (HYP)'; color: var(--rouge); }
  .cell .band { align-self: stretch; height: 20%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .95em; line-height: 1; }
  .cell .ic { font-size: 1.6em; line-height: 1; }
  .cell.corner .ic { font-size: 3em; }
  .cell .price { font-size: .95em; color: #4a6585; }
  .owner { position: absolute; inset: auto 0 0 0; height: max(3px, 7%); }
  .tokens { display: flex; flex-wrap: wrap; justify-content: center; min-height: 1px; }
  .tokens span { width: 2.3em; height: 2.3em; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); margin: -.3em;
    display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 1em; position: relative; z-index: 1; }

  #center { grid-area: 2 / 2 / 11 / 11; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: safe center;

    background: radial-gradient(circle at 50% 38%, #1f6099 0%, var(--marine-2) 55%, var(--marine) 100%); }
  #center .wm { position: absolute; inset: 0; display: grid; place-items: center; opacity: .07; pointer-events: none; }
  #center .wm svg { width: 72%; }
  #center > :not(.wm) { position: relative; }
  .dice-row { display: flex; gap: 2.2cqi; }
  .die { width: clamp(34px, 9cqi, 76px); aspect-ratio: 1; background: #fff; border-radius: 22%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 12%; box-shadow: 0 4px 0 #b9d7ea, 0 8px 18px rgba(0,0,0,.35); }
  .die i { width: 72%; height: 72%; place-self: center; border-radius: 50%; } .die i.on { background: var(--marine); }
  .die.pw { background: linear-gradient(180deg, #52c6f1, var(--ciel-d)); box-shadow: 0 4px 0 #0b6e9c, 0 8px 18px rgba(0,0,0,.35); place-items: center; padding: 0; }
  .die.pw span { grid-area: 1 / 1 / 4 / 4; font-size: clamp(18px, 5cqi, 40px); line-height: 1; }
  .die.roll { animation: roll .6s cubic-bezier(.3,1.4,.5,1); }
  @keyframes roll { 0% { transform: rotate(0) scale(1); } 40% { transform: rotate(-220deg) scale(1.25) translateY(-8px); } 100% { transform: rotate(-360deg) scale(1); } }
  .turn { font-size: clamp(16px, 3.6cqi, 30px); font-weight: 900; line-height: 1.15; }
  .turn .who { color: var(--ciel); }
  .last { font-size: clamp(11px, 1.9cqi, 15px); opacity: .8; max-width: 92%; font-weight: 600; }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 1.4cqi; width: min(100%, 56cqi); }
  #center .btn { min-height: clamp(44px, 8.5cqi, 68px); font-size: clamp(14px, 2.7cqi, 21px); border-radius: clamp(12px, 2cqi, 18px); padding: 6px 14px; }
  #center .btn.sm { min-height: clamp(36px, 6.5cqi, 50px); font-size: clamp(12px, 2.1cqi, 16px); }
  .bid { font-size: clamp(26px, 6cqi, 48px); font-weight: 900; color: var(--ciel); line-height: 1; }
  .warn { color: #ff9aa2; font-weight: 800; }
  .think::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* ---------- Panneau latéral ---------- */
  #side { width: min(96vw, 380px); display: flex; flex-direction: column; gap: 12px; }
  .panel { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 14px; }
  .panel h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 50px; flex-shrink: 0; }
  .brand b { font-size: 20px; font-weight: 900; letter-spacing: .04em; } .brand small { display: block; opacity: .7; font-weight: 600; }
  .brand > div { flex: 1; }
  .pl { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.05); border: 2px solid transparent; }
  .pl + .pl { margin-top: 8px; }
  .pl.cur { border-color: var(--ciel); background: rgba(47,174,224,.16); }
  .pl.out { opacity: .4; text-decoration: line-through; }
  .pl .tok { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; border: 2px solid #fff; flex-shrink: 0; }
  .pl .nm { font-weight: 800; } .pl .tags { font-size: 13px; min-height: 1em; }
  .pl .money { margin-left: auto; text-align: right; font-weight: 900; font-size: 18px; white-space: nowrap; }
  .pl .money small { display: block; font-weight: 600; font-size: 11px; opacity: .7; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--vert); vertical-align: middle; } .live.off { background: #778; }
  .chip { display: inline-block; padding: 6px 10px; margin: 3px; border-radius: 12px; border-left: 6px solid; background: #fff; color: var(--txt); cursor: pointer; font-size: 13px; font-weight: 700; }
  #log, #chat { font-size: 13px; max-height: 11em; overflow: auto; line-height: 1.5; opacity: .85; }
  code { display: block; word-break: break-all; background: rgba(0,0,0,.3); padding: 8px; border-radius: 10px; font-size: 12px; margin: 6px 0; }
  .stack { display: flex; flex-direction: column; gap: 8px; }

  /* ---------- Fenêtres ---------- */
  #modal { position: fixed; inset: 0; background: rgba(4,12,26,.72); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; z-index: 50; }
  #modal:empty { display: none; }
  .sheet { background: #fff; color: var(--txt); width: min(440px, 100%); max-height: 90vh; overflow: auto; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  #modal.still .sheet { animation: none; }
  .sheet h3 { margin: 0; padding: 18px; text-align: center; color: #fff; font-size: 21px; font-weight: 900; background: var(--marine-2); text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .sheet .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .sheet table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .sheet td { padding: 5px 4px; border-bottom: 1px solid #e6eef4; } .sheet td:last-child { text-align: right; font-weight: 800; }
  .sheet .btn { color: var(--marine); background: #eef6fb; border-color: #cfe3ef; }
  .sheet .btn.primary { color: #fff; background: linear-gradient(180deg, #52c6f1, var(--ciel-d)); border-color: transparent; }
  .sheet .btn.danger { color: var(--rouge); background: #fff; border-color: #f2b8bd; }
  .sheet label { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-weight: 600; }
  .sheet input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--ciel); }
  .sheet select, .sheet input[type=number] { font: inherit; font-weight: 700; padding: 10px; border-radius: 12px; border: 2px solid #cfe3ef; min-height: 46px; }
  .pw-list { display: flex; flex-direction: column; gap: 10px; }
  .pw-item { display: flex; gap: 12px; align-items: center; background: #eef6fb; border-radius: 14px; padding: 10px 12px; }
  .pw-item .e { font-size: 30px; width: 46px; height: 46px; border-radius: 12px; background: var(--ciel); display: grid; place-items: center; flex-shrink: 0; }
  .pw-item b { display: block; }
  .muted { color: #5b7088; font-size: 14px; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 160%); background: #fff; color: var(--marine); padding: 12px 22px 12px 14px;
    border-radius: 20px; font-weight: 800; box-shadow: 0 16px 40px rgba(0,0,0,.45); z-index: 60; transition: transform .4s cubic-bezier(.2,1.4,.4,1);
    display: flex; gap: 12px; align-items: center; max-width: 92vw; border: 3px solid var(--ciel); }
  #toast.show { transform: translate(-50%, 0); }
  #toast .e { font-size: 34px; } #toast small { display: block; font-weight: 600; color: #5b7088; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>

const crest = (sm = '') => `<div class="crest ${sm}"><div class="star">★</div>${LOGO}</div>`;

// ---------- Plateau : Marseille ----------
const S = (n, p, g, h, r) => ({ n, t: 'street', p, g, h, r });
const G = n => ({ n, t: 'station', p: 200, ic: '🚉' });

const CHANCE = () => X('Chance', 'card', 'ch', '❓'), CAISSE = () => X('Caisse du club', 'card', 'cc', '💰');
const C = [

  S("Rue d'Aubagne", 60, 'br', 50, [4, 20, 60, 180, 320, 450]), X('Impôts', 'tax', 200, '💸'), G('Gare Saint-Charles'),
  S('Le Panier', 100, 'lb', 50, [6, 30, 90, 270, 400, 550]), CHANCE(),
  S('Cours Julien', 100, 'lb', 50, [6, 30, 90, 270, 400, 550]), S('La Plaine', 120, 'lb', 50, [8, 40, 100, 300, 450, 600]),
  X('Les Baumettes', 'jail', 0, '🔒'), S('Longchamp', 140, 'pk', 100, [10, 50, 150, 450, 625, 750]), U("Cie d'électricité", '💡'),
  S('Les Réformés', 140, 'pk', 100, [10, 50, 150, 450, 625, 750]), S('La Canebière', 160, 'pk', 100, [12, 60, 180, 500, 700, 900]),
  G('Métro Rond-Point du Prado'), S('Castellane', 180, 'or', 100, [14, 70, 200, 550, 750, 950]), CAISSE(),
  S('Rue de Rome', 180, 'or', 100, [14, 70, 200, 550, 750, 950]), S('Rue Paradis', 200, 'or', 100, [16, 80, 220, 600, 800, 1000]),
  X('Mi-temps', 'park', 0, '☕'), S("L'Estaque", 220, 'rd', 150, [18, 90, 250, 700, 875, 1050]), CHANCE(),
  S('Pointe Rouge', 220, 'rd', 150, [18, 90, 250, 700, 875, 1050]), S('Les Goudes', 240, 'rd', 150, [20, 100, 300, 750, 925, 1100]),
  G('Gare Maritime'), S('Vallon des Auffes', 260, 'ye', 150, [22, 110, 330, 800, 975, 1150]),
  S('Le Pharo', 260, 'ye', 150, [22, 110, 330, 800, 975, 1150]), U('Eaux de Marseille', '💧'),

  S('Le MuCEM', 300, 'gr', 200, [26, 130, 390, 900, 1100, 1275]), S('Notre-Dame de la Garde', 300, 'gr', 200, [26, 130, 390, 900, 1100, 1275]),
  CAISSE(), S('Le Vieux-Port', 320, 'gr', 200, [28, 150, 450, 1000, 1200, 1400]), G('Aéroport Marignane'),
  CHANCE(), S('La Commanderie', 350, 'db', 200, [35, 175, 500, 1100, 1300, 1500]), X('Amende de la LFP', 'tax', 100, '🟨'),
  S('Stade Vélodrome', 400, 'db', 200, [50, 200, 600, 1400, 1700, 2000]),
];
const GC = { br: '#8b5a2b', lb: '#7fd3f5', pk: '#d63384', or: '#fd7e14', rd: '#e63946', ye: '#ffc107', gr: '#2a9d5c', db: '#1b3f9c' };
const PC = ['#2FAEE0', '#E63946', '#F4A261', '#9B5DE5', '#2A9D8F', '#FF6FB5', '#8AC926', '#6C757D'];
const BOTS = ['César', 'Fanny', 'Marius', 'Panisse', 'Honorine', 'Escartefigue', 'Olive'];
const CH = [
  ["Coup d'envoi ! Avancez jusqu'à la case Départ", { to: 0 }],
  ['Rendez-vous aux Goudes', { to: 24 }],
  ["Avancez jusqu'à Longchamp", { to: 11 }],
  ['Prenez le métro au Rond-Point du Prado', { to: 15 }],
  ['Soir de match : direction le Stade Vélodrome !', { to: 39 }],
  ["Avancez jusqu'à la gare la plus proche", { station: 1 }],
  ['Hors-jeu ! Reculez de trois cases', { back: 3 }],
  ['Allez aux Baumettes', { jail: 1 }],
  ['Libéré des Baumettes (carte à conserver)', { free: 1 }],
  ['Prime de match : 50€', { m: 50 }],
  ['Transfert réussi : 150€', { m: 150 }],
  ['Tu gagnes ton prono OM-PSG : 100€', { m: 100 }],
  ['Excès de vitesse sur le Prado : 15€', { m: -15 }],
  ['Fumigène en tribune : 20€', { m: -20 }],
  ['Abonnement annuel au Vélodrome : 150€', { m: -150 }],
  ['Réparations : 25€ par maison, 100€ par hôtel', { rep: [25, 100] }],
];
const CC = [
  ["Avancez jusqu'à la case Départ", { to: 0 }],
  ['Retournez à Noailles', { goto: 1 }],
  ['Allez aux Baumettes', { jail: 1 }],
  ['Libéré des Baumettes (carte à conserver)', { free: 1 }],

];
// Le « Dé OM » : 3e dé lancé avec les deux autres, chaque face déclenche un pouvoir
const POWERS = [
  { e: '⚽', n: 'Droit au but', d: 'La banque te verse 100€.' },
  { e: '💨', n: 'Contre-attaque', d: 'Tu avances de 3 cases en plus.' },

// ---------- Identité de l'appareil (survit au rechargement) ----------
const $ = id => document.getElementById(id);
const rid = () => Math.random().toString(36).slice(2, 10);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---------- Réseau ----------

const isHost = !room;
let peer, conns = [], hostConn, link = '', net = isHost ? '' : 'Connexion à la partie…';
const shuffle = n => [...Array(n).keys()].sort(() => Math.random() - .5);
const fresh = mode => ({ host: cid, mode, powers: true, players: [], props: {}, turn: 0, turnNo: 0, phase: 'roll', dice: [1, 1], rolls: 0, dbl: false, ndbl: 0,

try { saved = JSON.parse(store.get('mono-save')); } catch {}

let st = null; // l'hôte choisit d'abord un mode sur l'écran d'accueil

function startHost(id, tries = 0) {
  net = 'Connexion…';
  peer = new Peer(id);
  peer.on('open', pid => { link = location.href.split('?')[0] + '?room=' + pid; net = ''; online(); });
  peer.on('error', e => {
    // après un rechargement, le serveur PeerJS garde l'ancien identifiant quelques secondes
    if (e.type === 'unavailable-id' && tries < 15) { net = 'Récupération de la partie…'; peer.destroy(); setTimeout(() => startHost(id, tries + 1), 3000); }
    else net = 'Réseau indisponible (' + e.type + ') — jeu local seulement';
    render();
  });
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });
  peer.on('connection', c => {
    conns.push(c);
    c.on('data', a => {
      if (a?.type === 'hello') { c.cid = String(a.cid).slice(0, 20); return online(); }
      if (c.cid) { apply(a, c.cid); sync(); }
    });
    c.on('close', () => { conns = conns.filter(x => x !== c); online(); });
  });
}
function connect() {
  hostConn = peer.connect(room, { reliable: true });
  hostConn.on('open', () => { net = ''; hostConn.send({ type: 'hello', cid }); render(); });
  hostConn.on('data', d => { st = d; render(); });
  hostConn.on('close', () => { net = 'Connexion perdue, reconnexion…'; render(); setTimeout(connect, 3000); });
}
if (!isHost) {
  peer = new Peer();
  peer.on('open', connect);
  peer.on('error', e => { net = e.type === 'peer-unavailable' ? "Partie introuvable (l'hôte est-il connecté ?), nouvel essai…" : 'Erreur réseau : ' + e.type; render(); if (e.type === 'peer-unavailable') setTimeout(connect, 3000); });
  peer.on('disconnected', () => peer.reconnect());
}
function online() { st.online = [cid, ...conns.filter(c => c.open && c.cid).map(c => c.cid)]; sync(); }
function sync() {
  conns.forEach(c => c.open && c.send(st));
  if (isHost && st) store.set('mono-save', JSON.stringify({ peerId: peer?.id, st }));
  render();
  botTick();
}
function act(a) { if (isHost) { apply(a, cid); sync(); } else hostConn?.open && hostConn.send(a); }
function newGame() {
  if (st?.started && !st.winner && !confirm('Effacer la partie en cours et en recommencer une ?')) return;
  store.set('mono-save', ''); location.href = location.href.split('?')[0];
}
function startSolo() {
  const name = $('nm').value.trim() || 'Moi';
  store.set('mono-name', name);
  st = fresh('solo');
  apply({ type: 'join', name }, cid);
  for (let k = 0; k < ui.bots; k++) apply({ type: 'join', bot: true }, cid);
  apply({ type: 'start', powers: ui.powers }, cid);

}
function playOnline() { st = fresh('online'); startHost(); render(); }
function resume() { st = saved.st; if (st.mode !== 'solo') startHost(saved.peerId); sync(); }

// ---------- Règles (exécutées uniquement chez l'hôte) ----------
const r6 = () => 1 + Math.floor(Math.random() * 6);
const log = m => { st.log.push(m); st.log = st.log.slice(-60); };
const group = i => C.map((c, j) => j).filter(j => C[i].g && C[j].g === C[i].g);
const ownsGroup = (pi, g) => C.every((c, j) => c.g !== g || st.props[j]?.owner === pi);
const groupBuilt = i => group(i).some(j => st.props[j]?.h > 0);
const unmortCost = i => Math.ceil(C[i].p * 0.55);
const ints = v => Array.isArray(v) ? [...new Set(v.filter(Number.isInteger))] : [];
const worth = pi => st.players[pi].money + Object.entries(st.props).reduce((n, [j, o]) => o.owner === pi ? n + (o.m ? C[j].p / 2 : C[j].p) + o.h * (C[j].h || 0) : n, 0);
const mineOwned = (i, pi) => st.props[i]?.owner === pi;
const owned = pi => Object.keys(st.props).map(Number).filter(j => st.props[j].owner === pi);

const canBuild = i => { const c = C[i], o = st.props[i], g = group(i);
  return c?.t === 'street' && mineOwned(i, st.turn) && ownsGroup(st.turn, c.g) && g.every(j => !st.props[j].m)
    && o.h < 5 && o.h === Math.min(...g.map(j => st.props[j].h)) && st.players[st.turn].money >= c.h; };
const canSell = i => { const o = st.props[i]; return mineOwned(i, st.turn) && o.h > 0 && o.h === Math.max(...group(i).map(j => st.props[j].h)); };
const canMort = i => mineOwned(i, st.turn) && !st.props[i].m && !groupBuilt(i);
const canUnmort = i => mineOwned(i, st.turn) && st.props[i].m && st.players[st.turn].money >= unmortCost(i);
const tradable = (i, pi) => mineOwned(i, pi) && !groupBuilt(i);

function apply(a, dev) {
  const s = st;
  if (!a || typeof a !== 'object') return;
  const pl = s.players[a.pi], myPl = pl && pl.dev === dev && !pl.out;
  if (a.type === 'join') {
    if (a.bot && dev !== s.host) return;
    const name = a.bot ? BOTS.find(n => !s.players.some(q => q.name === n)) || 'Robot' : typeof a.name === 'string' && a.name.trim().slice(0, 16);
    if (!s.started && s.players.length < 8 && name !== false)
      s.players.push({ name: name || 'Joueur', dev: a.bot ? 'bot-' + rid() : dev, bot: !!a.bot, pos: 0, money: 1500, inJail: false, jt: 0, cards: 0,
        shield: 0, skip: 0, out: false, color: PC[s.players.length] });
    return;
  }
  if (a.type === 'leave') {
    if (!s.started && (myPl || (pl?.bot && dev === s.host))) { s.players.splice(a.pi, 1); s.players.forEach((q, k) => q.color = PC[k]); }
    return;
  }
  if (a.type === 'chat') {
    if (typeof a.text === 'string' && a.text.trim()) { s.chat.push((s.players.find(p => p.dev === dev)?.name || 'Invité') + ' : ' + a.text.trim().slice(0, 200)); s.chat = s.chat.slice(-60); }
    return;
  }
  if (a.type === 'start') {
    if (dev === s.host && s.players.length >= 2 && !s.started) {
      s.started = true; s.powers = a.powers !== false; s.turn = Math.floor(Math.random() * s.players.length);
      log(`Coup d'envoi ! ${s.players[s.turn].name} joue en premier.`);
    }
    return;
  }
  if (!s.started || s.winner) return;

  // Actions de l'hôte pour débloquer la partie
  if (dev === s.host) {
    if (a.type === 'skip') {
      log(`L'hôte fait passer le tour de ${s.players[s.turn].name}`);
      if (s.phase === 'auction') return endAuction();
      if (s.phase === 'debt') { const to = s.debt.to; s.debt = null; bankrupt(s.turn, to); }
      return next();
    }
    if (a.type === 'kick' && pl && !pl.out) {
      log(`L'hôte exclut ${pl.name}`);
      bankrupt(a.pi, null);
      if (s.phase === 'auction') { s.auction.out.push(a.pi); if (s.auction.by === a.pi) { s.auction.by = null; s.auction.bid = 0; } return checkAuction(); }
      if (a.pi === s.turn) { s.debt = null; next(); }
      return;
    }
    if (a.type === 'finish') {
      const best = s.players.map((q, k) => k).filter(k => !s.players[k].out).sort((x, y) => worth(y) - worth(x))[0];
      s.winner = s.players[best].name; log(`🏆 Partie terminée : ${s.winner} est le plus riche (${worth(best)}€) !`);
      return;
    }
  }

  // Enchères : tous les joueurs participent
  if (s.phase === 'auction' && myPl) {
    const A = s.auction;
    if (a.type === 'bid' && Number.isInteger(a.n) && a.n > A.bid && a.n <= pl.money && !A.out.includes(a.pi)) {
      A.bid = a.n; A.by = a.pi; log(`${pl.name} enchérit : ${a.n}€`); return checkAuction();
    }
    if (a.type === 'nobid' && a.pi !== A.by && !A.out.includes(a.pi)) { A.out.push(a.pi); log(`${pl.name} se retire des enchères`); return checkAuction(); }
  }

  // Réponse à une proposition d'échange
  const T = s.trade;
  if (T && myPl && a.pi === T.to) {
    if (a.type === 'refuse') { log(`${pl.name} refuse l'échange`); s.trade = null; return; }
    if (a.type === 'accept') {
      const from = s.players[T.from];
      if (!T.give.every(i => tradable(i, T.from)) || !T.get.every(i => tradable(i, T.to))) { s.trade = null; return log('Échange annulé (propriétés modifiées)'); }
      if ((T.money > 0 && from.money < T.money) || (T.money < 0 && pl.money < -T.money)) return log("Échange impossible : pas assez d'argent");
      T.give.forEach(i => s.props[i].owner = T.to);
      T.get.forEach(i => s.props[i].owner = T.from);
      from.money -= T.money; pl.money += T.money;
      log(`🤝 Échange conclu entre ${from.name} et ${pl.name}`);
      s.trade = null; return;
    }
  }

  // Actions du joueur dont c'est le tour
  const p = s.players[s.turn];
  if (p.dev !== dev) return;
  const ph = s.phase, manage = ['roll', 'end', 'debt', 'buy'].includes(ph), free = ph === 'roll' || ph === 'end';
  const i = a.i;
  switch (a.type) {
    case 'roll': if (ph === 'roll') roll(p); break;
    case 'aim':
      if (ph === 'aim' && s.aim?.[a.k] != null) {
        const n = s.aim[a.k]; s.aim = null; s.phase = '';
        log(`🎯 ${p.name} choisit d'avancer de ${n}`); move(p, n); settle(p);
      } break;
    case 'payjail': if (ph === 'roll' && p.inJail && p.money >= 50) { p.money -= 50; p.inJail = false; log(`${p.name} paie 50€ et sort des Baumettes`); } break;
    case 'usecard': if (ph === 'roll' && p.inJail && p.cards > 0) { p.cards--; p.inJail = false; log(`${p.name} utilise sa carte « libéré »`); } break;
    case 'buy':
      if (ph === 'buy' && p.money >= C[p.pos].p) {
        p.money -= C[p.pos].p; s.props[p.pos] = { owner: s.turn, h: 0, m: false };
        log(`${p.name} achète ${C[p.pos].n} (${C[p.pos].p}€)`); s.phase = ''; settle(p);
      } break;
    case 'pass': if (ph === 'buy') startAuction(p.pos); break;
    case 'end': if (ph === 'end') next(); break;
    case 'build': if (free && canBuild(i)) { p.money -= C[i].h; s.props[i].h++; log(`${p.name} construit ${s.props[i].h === 5 ? 'un hôtel' : 'une maison'} sur ${C[i].n}`); } break;
    case 'sell': if (manage && canSell(i)) { s.props[i].h--; p.money += C[i].h / 2; log(`${p.name} revend une construction sur ${C[i].n} (+${C[i].h / 2}€)`); } break;
    case 'mort': if (manage && canMort(i)) { s.props[i].m = true; p.money += C[i].p / 2; log(`${p.name} hypothèque ${C[i].n} (+${C[i].p / 2}€)`); } break;
    case 'unmort': if (manage && canUnmort(i)) { s.props[i].m = false; p.money -= unmortCost(i); log(`${p.name} lève l'hypothèque de ${C[i].n} (-${unmortCost(i)}€)`); } break;
    case 'paydebt':
      if (ph === 'debt' && p.money >= s.debt.amt) {
        const { amt, to, move: mv } = s.debt;
        p.money -= amt; if (to != null) s.players[to].money += amt;
        log(`${p.name} paie sa dette de ${amt}€${to != null ? ' à ' + s.players[to].name : ''}`);
        s.debt = null; s.phase = ''; if (mv) move(p, mv); settle(p);
      } break;
    case 'bankrupt': if (ph === 'debt') { const to = s.debt.to; s.debt = null; bankrupt(s.turn, to); next(); } break;
    case 'propose': {
      const q = s.players[a.to], give = ints(a.give), get = ints(a.get), money = Math.trunc(Number(a.money)) || 0;
      if (!free || T || !q || q.out || a.to === s.turn) break;
      if (!give.every(j => tradable(j, s.turn)) || !get.every(j => tradable(j, a.to)) || (!give.length && !get.length && !money)) break;
      s.trade = { from: s.turn, to: a.to, give, get, money };
      (s.asked ||= {})[a.to + ':' + get.join(',')] = s.turnNo;
      log(`${p.name} propose un échange à ${q.name}`);
      break;
    }
    case 'cancel': if (T) { s.trade = null; log(`${p.name} annule sa proposition`); } break;
  }
}

function roll(p) {
  const s = st, d = [r6(), r6()], dbl = d[0] === d[1];
  s.dice = d; s.rolls++; s.phase = '';
  s.pw = s.powers ? Math.floor(Math.random() * 6) : null;
  log(`${p.name} lance ${d[0]} + ${d[1]}${dbl ? ' (double !)' : ''}`);
  if (s.pw !== null) power(p, s.pw);
  const sum = d[0] + d[1] + (s.pw === 1 ? 3 : 0);
  if (p.inJail) {
    s.dbl = false; // sortir de prison ne fait pas rejouer
    if (dbl) { p.inJail = false; log(`${p.name} sort des Baumettes`); }
    else if (++p.jt >= 3) { p.inJail = false; log('3e essai raté : amende de 50€'); if (!pay(p, 50)) { s.debt.move = sum; return; } }
    else { log(`${p.name} reste aux Baumettes`); return settle(p); }
  } else {
    s.dbl = dbl;
    if (dbl && ++s.ndbl === 3) { log('3 doubles de suite !'); jail(p); return settle(p); }
  }
  if (s.pw === 2) { s.aim = [d[0], d[1], d[0] + d[1]]; s.phase = 'aim'; return; }
  move(p, sum); settle(p);
}
function power(p, f) {
  const s = st, pi = s.players.indexOf(p), others = s.players.map((q, k) => k).filter(k => k !== pi && !s.players[k].out);
  let t;
  if (f === 0) { p.money += 100; t = `${p.name} reçoit 100€ de la banque`; }
  else if (f === 1) t = `${p.name} avance de 3 cases en plus`;
  else if (f === 2) t = `${p.name} choisit son déplacement`;
  else if (f === 3) { p.shield = Math.min((p.shield || 0) + 1, 3); t = `${p.name} gagne un bouclier contre le prochain loyer`; }
  else if (f === 4) {
    const k = others.sort((x, y) => worth(y) - worth(x))[0];
    if (k != null) { s.players[k].skip = 1; t = `${s.players[k].name} passera son prochain tour`; } else t = 'personne à expulser';
  } else {
    let n = 0;
    others.forEach(k => { const q = s.players[k], v = Math.min(25, q.money); q.money -= v; p.money += v; n += v; });
    t = `${p.name} encaisse ${n}€ de billetterie`;
  }
  s.pwTxt = t;
  log(`${POWERS[f].e} ${POWERS[f].n} : ${t}`);
}
function settle(p) {
  if (p.out) return next();
  if (['debt', 'buy', 'auction', 'aim'].includes(st.phase)) return;
  st.phase = st.dbl && !p.inJail ? 'roll' : 'end';
}
function next() {
  st.ndbl = 0; st.dbl = false; st.phase = 'roll'; st.trade = null; st.aim = null;
  if (st.winner) return;
  for (;;) {
    do st.turn = (st.turn + 1) % st.players.length; while (st.players[st.turn].out);
    const q = st.players[st.turn];
    if (!q.skip) break;
    q.skip = 0; log(`🟥 ${q.name} est suspendu et passe son tour`);
  }
  st.turnNo++;
}
function jail(p) { p.pos = 10; p.inJail = true; p.jt = 0; st.dbl = false; log(`${p.name} va aux Baumettes`); }
function move(p, n) {
  p.pos += n;
  if (p.pos >= 40) { p.pos -= 40; p.money += 200; log(`${p.name} passe par Départ : +200€`); }
  if (p.pos < 0) p.pos += 40;
  land(p);
}
function land(p) {
  const c = C[p.pos], o = st.props[p.pos];
  log(`${p.name} arrive sur ${c.n}`);
  if (c.p) {
    if (!o) st.phase = 'buy';
    else if (o.owner !== st.turn) {
      const r = rent(p.pos);
      if (!r) log('Propriété hypothéquée : pas de loyer');
      else if (p.shield) { p.shield--; log(`🛡️ Mur défensif : ${p.name} ne paie pas les ${r}€ de loyer`); }
      else pay(p, r, o.owner);
    }
  } else if (c.t === 'tax') pay(p, c.a);
  else if (c.t === 'gojail') jail(p);
  else if (c.t === 'card') card(p, c.a);
}
function card(p, deck) {
  const d = st.decks[deck], k = d.shift();
  const [txt, e] = (deck === 'ch' ? CH : CC)[k];
  if (!e.free) d.push(k); // shortcut: la carte « libéré » n'est pas remise dans la pioche, même après usage
  log(`🃏 ${deck === 'ch' ? 'Chance' : 'Caisse du club'} : ${txt}`);
  if (e.m > 0) p.money += e.m;
  else if (e.m < 0) pay(p, -e.m);
  else if ('to' in e) move(p, (e.to - p.pos + 40) % 40);
  else if ('goto' in e) { p.pos = e.goto; land(p); }
  else if (e.back) move(p, -e.back);
  else if (e.jail) jail(p);
  else if (e.free) p.cards++;
  else if (e.station) { const t = [5, 15, 25, 35].find(j => j > p.pos) ?? 5; move(p, (t - p.pos + 40) % 40); }
  else if (e.rep) pay(p, Object.values(st.props).reduce((n, o) => o.owner === st.turn ? n + (o.h === 5 ? e.rep[1] : o.h * e.rep[0]) : n, 0));
  else if (e.bday) st.players.forEach(q => { if (q !== p && !q.out) { const v = Math.min(e.bday, q.money); q.money -= v; p.money += v; } });
}
function rent(i) {
  const c = C[i], o = st.props[i];
  if (o.m) return 0;
  const mine = Object.keys(st.props).filter(j => st.props[j].owner === o.owner).map(j => C[j]);
  if (c.t === 'station') return 25 * 2 ** (mine.filter(x => x.t === 'station').length - 1);
  if (c.t === 'util') return (mine.filter(x => x.t === 'util').length === 2 ? 10 : 4) * (st.dice[0] + st.dice[1]);
  return o.h ? c.r[o.h] : c.r[0] * (ownsGroup(o.owner, c.g) ? 2 : 1);
}
// Renvoie true si payé ; sinon le joueur passe en phase « dette » et doit vendre, hypothéquer ou faire faillite
function pay(p, amt, to) {
  if (amt <= 0) return true;
  if (p.money >= amt) {
    p.money -= amt; if (to != null) st.players[to].money += amt;
    log(`${p.name} paie ${amt}€${to != null ? ' à ' + st.players[to].name : ''}`);
    return true;
  }
  st.debt = { amt, to }; st.phase = 'debt';
  log(`⚠️ ${p.name} doit ${amt}€ mais n'a que ${p.money}€`);

}
function bankrupt(pi, to) {
  const p = st.players[pi];
  let cash = p.money;
  for (const j in st.props) {
    const o = st.props[j]; if (o.owner !== pi) continue;
    cash += o.h * (C[j].h || 0) / 2; o.h = 0; // les constructions sont revendues à la banque
    if (to != null) o.owner = to; else delete st.props[j];
  }
  if (to != null) { st.players[to].money += cash; st.players[to].cards += p.cards; }
  p.money = 0; p.cards = 0; p.out = true; p.inJail = false;
  log(`💀 ${p.name} fait faillite${to != null ? ', tout revient à ' + st.players[to].name : ''}`);
  const alive = st.players.filter(q => !q.out);
  if (alive.length === 1) { st.winner = alive[0].name; log(`🏆 ${st.winner} gagne la partie !`); }
}
function startAuction(i) {
  st.phase = 'auction'; st.auction = { i, bid: 0, by: null, out: [] };
  log(`🔨 Enchères pour ${C[i].n}`);
  checkAuction();
}
function checkAuction() {
  const A = st.auction, left = st.players.map((q, k) => k).filter(k => !st.players[k].out && !A.out.includes(k));
  if (!left.length || (A.by !== null && left.length === 1 && left[0] === A.by)) endAuction();
}
function endAuction() {
  const A = st.auction;
  if (A.by !== null) { const w = st.players[A.by]; w.money -= A.bid; st.props[A.i] = { owner: A.by, h: 0, m: false }; log(`🔨 ${w.name} remporte ${C[A.i].n} pour ${A.bid}€`); }
  else log(`🔨 Personne n'achète ${C[A.i].n}`);
  st.auction = null; st.phase = '';
  settle(st.players[st.turn]);
}

// ---------- IA (jouée par l'hôte) ----------
// Valeur d'une propriété pour le joueur k : plus chère si elle complète son groupe ou bloque celui d'un adversaire
function botValue(i, k) {
  const c = C[i], mates = C.map((x, j) => j).filter(j => j !== i && (c.g ? C[j].g === c.g : C[j].t === c.t));
  const mine = mates.filter(j => st.props[j]?.owner === k).length;
  const others = new Set(mates.map(j => st.props[j]?.owner).filter(o => o != null && o !== k));
  if (c.g && mine === mates.length) return c.p * 2;
  if (c.g && others.size === 1 && mates.every(j => st.props[j])) return Math.round(c.p * 1.4);
  return Math.round(c.p * (1 + 0.35 * mine));
}
const completes = (i, k) => !!C[i].g && C.every((c, j) => j === i || c.g !== C[i].g || st.props[j]?.owner === k);
function spotScore(i, pi) {
  const c = C[i], o = st.props[i], p = st.players[pi];
  if (c.t === 'gojail') return -200;
  if (c.t === 'tax') return -c.a;
  if (!c.p) return c.t === 'card' ? 15 : 10;
  if (!o) return p.money >= c.p ? botValue(i, pi) / 2 : 0;
  return o.owner === pi ? 5 : p.shield ? 0 : -rent(i);
}
function tradeScore(T) {
  const from = st.players[T.from], bot = st.players[T.to];
  if ((T.money > 0 && from.money < T.money) || (T.money < 0 && bot.money < -T.money)) return -1;
  const gain = T.give.reduce((n, j) => n + botValue(j, T.to), 0) + T.money;
  return gain - T.get.reduce((n, j) => n + askPrice(j, T.to, T.from), 0);
}
// Prix minimum auquel le joueur k cède la rue j à l'acheteur b
const askPrice = (j, k, b) => Math.max(botValue(j, k), C[j].p) * (completes(j, b) ? 2.2 : 1) * 1.15;
// Constructions et levées d'hypothèque quand l'IA a de la marge
function botManage(pi, reserve) {
  const p = st.players[pi], own = owned(pi);
  const b = own.filter(i => canBuild(i) && p.money - C[i].h >= reserve).sort((x, y) => C[y].p - C[x].p)[0];
  if (b != null) return { type: 'build', i: b };
  const u = own.find(i => canUnmort(i) && p.money - unmortCost(i) > 500);
  return u != null ? { type: 'unmort', i: u } : null;
}
// L'IA propose de racheter la dernière rue qui lui manque pour compléter un groupe (au plus une fois toutes les 4 manches)
function botAsk(pi) {
  const p = st.players[pi];
  for (const g in GC) {
    const miss = C.map((c, j) => j).filter(j => C[j].g === g && st.props[j]?.owner !== pi);
    const j = miss[0], o = st.props[j];
    if (miss.length !== 1 || !o || !tradable(j, o.owner)) continue;
    const offer = Math.ceil(askPrice(j, o.owner, pi) / 10) * 10 + 10;
    if (p.money - offer < 150 || offer > C[j].p * 4 || st.turnNo - (st.asked?.[o.owner + ':' + j] ?? -99) < 4 * st.players.length) continue;
    return { type: 'propose', to: o.owner, give: [], get: [j], money: offer };
  }
  return null;
}
// Renvoie [action, appareil du bot, délai] ou null si aucun bot n'a à jouer
function botJob() {
  const s = st;
  if (!s?.started || s.winner) return null;
  if (s.phase === 'auction') {
    const A = s.auction;
    for (const [k, q] of s.players.entries()) {
      if (!q.bot || q.out || A.out.includes(k) || A.by === k) continue;
      const max = Math.min(botValue(A.i, k), q.money - 50), step = A.bid + 50 <= max * .9 ? 50 : A.bid + 10 <= max ? 10 : 0;
      return [step ? { type: 'bid', pi: k, n: A.bid + step } : { type: 'nobid', pi: k }, q.dev, 800];
    }
    return null;
  }
  const T = s.trade;
  if (T && s.players[T.to].bot) return [{ type: tradeScore(T) > 0 ? 'accept' : 'refuse', pi: T.to }, s.players[T.to].dev, 1400];
  const cur = s.players[s.turn], pi = s.turn, A = (a, t = 900) => [a, cur.dev, t];
  if (!cur?.bot || cur.out || T) return null;
  switch (s.phase) {
    case 'roll': {
      const m = botManage(pi, 250) || botAsk(pi); if (m) return A(m, 700);
      if (cur.inJail && cur.cards) return A({ type: 'usecard' });
      if (cur.inJail && cur.money >= 400) return A({ type: 'payjail' });
      return A({ type: 'roll' }, 1100);
    }
    case 'aim': {
      const sc = s.aim.map(n => spotScore((cur.pos + n) % 40, pi) + (cur.pos + n >= 40 ? 200 : 0));
      return A({ type: 'aim', k: sc.indexOf(Math.max(...sc)) }, 1300);
    }
    case 'buy': {
      const c = C[cur.pos], keep = completes(cur.pos, pi) ? 0 : botValue(cur.pos, pi) > c.p ? 40 : 120;
      return A({ type: cur.money - c.p >= keep ? 'buy' : 'pass' }, 1100);
    }
    case 'end': { const m = botManage(pi, 200); return m ? A(m, 600) : A({ type: 'end' }, 1000); }
    case 'debt': {
      if (cur.money >= s.debt.amt) return A({ type: 'paydebt' });
      const own = owned(pi), sell = own.find(canSell);
      if (sell != null) return A({ type: 'sell', i: sell }, 600);
      const mort = own.filter(canMort).sort((x, y) => (completes(x, pi) ? 1000 : 0) + C[x].p - (completes(y, pi) ? 1000 : 0) - C[y].p)[0];
      return A(mort != null ? { type: 'mort', i: mort } : { type: 'bankrupt' }, 700);
    }
  }
  return null;
}
let botTimer = null;
function botTick() {
  clearTimeout(botTimer);
  if (!isHost) return;
  const job = botJob();
  if (job) botTimer = setTimeout(() => { const j = botJob(); if (j) { apply(j[0], j[1]); sync(); } }, job[2]);
}

function beep() {

}

  }
  return `<div class="sheet"><h3 style="background:${col}">${c.ic || ''} ${esc(c.n)}</h3><div class="body">${rows ? `<table>${rows}</table>` : `<div class="muted">${c.t === 'card' ? 'Tire une carte en arrivant ici.' : c.t === 'go' ? 'Reçois 200€ à chaque passage.' : c.t === 'gojail' ? 'Direction les Baumettes, sans passer par Départ.' : c.t === 'jail' ? 'Simple visite si tu ne fais que passer.' : 'Pause à la mi-temps : rien ne se passe.'}</div>`}
    ${btn}<button class="btn" onclick="closeModal()">Fermer</button></div></div>`;
}

function tradeHTML(keep) {
  const s = st, others = s.players.map((q, k) => k).filter(k => k !== s.turn && !s.players[k].out);
  const to = others.includes(+keep.tt) ? +keep.tt : others[0];
  const list = (pi, pre) => owned(pi).filter(j => tradable(j, pi))
    .map(j => `<label><input type="checkbox" id="${pre}${j}"> ${esc(C[j].n)}${s.props[j].m ? ' (HYP)' : ''}</label>`).join('') || '<small class="muted">aucune</small>';
  return `<div class="sheet"><h3>🤝 Échange</h3><div class="body">
    <label>Avec <select id="tt" onchange="render()">${others.map(k => `<option value="${k}" ${k === to ? 'selected' : ''}>${esc(s.players[k].name)}</option>`).join('')}</select></label>
    <b>Je donne</b>${list(s.turn, 'g')}<label>+ <input id="tmg" type="number" min="0" style="width:110px"> €</label>
    <b>Je reçois</b>${list(to, 'r')}<label>+ <input id="tmr" type="number" min="0" style="width:110px"> €</label>
    <small class="muted">Les terrains d'un groupe avec des maisons ne s'échangent pas.${s.players[to]?.bot ? " L'IA n'accepte que les échanges à son avantage !" : ''}</small>
    <button class="btn primary" onclick="sendTrade(${to})">Envoyer la proposition</button><button class="btn" onclick="closeModal()">Annuler</button></div></div>`;
}

function modalHTML(keep) {
  const s = st, m = ui.modal;
  if (s?.winner && !ui.winSeen) {
    const rank = s.players.map((q, k) => k).sort((x, y) => worth(y) - worth(x));
    return `<div class="sheet"><h3>🏆 ${esc(s.winner)} gagne !</h3><div class="body"><table>${rank.map((k, n) => `<tr><td>${n + 1}. ${esc(s.players[k].name)}${s.players[k].out ? ' 💀' : ''}</td><td>${worth(k)}€</td></tr>`).join('')}</table>
      ${s.host === cid ? '<button class="btn primary" onclick="newGame()">Nouvelle partie</button>' : ''}<button class="btn" onclick="closeModal()">Voir le plateau</button></div></div>`;
  }
  if (m?.k === 'rules') return `<div class="sheet"><h3>🎲 Les pouvoirs des dés</h3><div class="body">
    <div class="muted">À chaque lancer, le <b>Dé OM</b> (le 3e dé, bleu ciel) roule avec les deux autres et déclenche un pouvoir :</div>
    <div class="pw-list">${POWERS.map(p => `<div class="pw-item"><span class="e">${p.e}</span><div><b>${p.n}</b><span class="muted">${p.d}</span></div></div>`).join('')}</div>
    <div class="muted">Tu peux désactiver les pouvoirs au lancement pour une partie classique.</div>
    <button class="btn primary" onclick="closeModal()">C'est parti !</button></div></div>`;
  if (!s || !m) return '';
  if (m.k === 'prop') return propCard(m.i);
  if (m.k === 'trade' && isMe(s.players[s.turn]) && (s.phase === 'roll' || s.phase === 'end') && !s.trade) return tradeHTML(keep);
  ui.modal = null;
  return '';
}

function render() {
  // Conserver ce que l'utilisateur est en train de taper
  const keep = {}, focus = document.activeElement?.id;
  document.querySelectorAll('#app input, #app select, #modal input, #modal select').forEach(e => keep[e.id] = e.type === 'checkbox' ? e.checked : e.value);
  if (st) {
    const myTurn = st.started && !st.winner && isMe(st.players[st.turn]);
    if (myTurn && st.mode !== 'solo' && st.turnNo !== lastBeep) { lastBeep = st.turnNo; beep(); }
    document.title = (myTurn ? '🎲 À toi ! — ' : '') + 'Monopoly OM';
    $('app').innerHTML = boardHTML() + sideHTML();
  } else $('app').innerHTML = isHost ? homeHTML() : `<div class="home">${crest()}<h1>MONOPOLY <span>OM</span></h1><p class="tag think">${esc(net)}</p></div>`;
  const md = $('modal'), html = modalHTML(keep);
  md.classList.toggle('still', md.innerHTML !== '' && html !== ''); // pas de réanimation quand l'IA rafraîchit l'écran
  md.innerHTML = html;
  for (const id in keep) { const e = $(id); if (e) e.type === 'checkbox' ? e.checked = keep[id] : e.value = keep[id]; }
  if (focus && $(focus)) $(focus).focus();
  const ch = $('chat'); if (ch) ch.scrollTop = ch.scrollHeight;
}
function addMe() { const e = $('nm'); act({ type: 'join', name: e.value }); e.value = ''; }
function sendMsg() { const e = $('msg'); if (e.value.trim()) act({ type: 'chat', text: e.value }); e.value = ''; }
function sendTrade(to) {
  const pick = pre => [...document.querySelectorAll(`#modal input[id^="${pre}"]:checked`)].map(e => +e.id.slice(pre.length));
  act({ type: 'propose', to, give: pick('g'), get: pick('r'), money: (+$('tmg').value || 0) - (+$('tmr').value || 0) });
  ui.modal = null; render();
}
render();
</script>
</body>
</html>
